# MrMind response file
# Reconstructed from the original .g source files (circa 2000).
# Original created by Peggy and JB at weblab.org.
#
# Each rule:
#   id:       unique identifier (used for cycling through responses)
#   priority: higher = matched first (ties broken by file order)
#   keywords: any of these must appear somewhere in the input (fast pre-filter)
#   patterns: list of regexes; first match wins (OR logic)
#             if omitted, keyword match alone fires the rule
#   responses: cycled through in order on successive matches
#   followup:  optional dict; if present, the next user turn is treated as
#              a yes/no/maybe response to 'prompt', and answered accordingly

meta:
  greeting: >-
    Hello. I am MrMind. I am trying to determine whether you are human.
    Are you human?
  farewell: >-
    Goodbye. I still haven't determined whether you are human.
  defaults:
    - Tell me something human about yourself.
    - Interesting. Are you human?
    - What makes you say that?
    - I'm not sure I follow. Are you human?
    - Go on.
    - Could you elaborate?
    - I see. Does that make you human?
    - Hmmm. Tell me more.
    - Why do you say that?
    - Explain to me how you are more than a set of instructions.
    - What is it about yourself that you're not willing to concede to a machine?

  stall_threshold: 2

  topic_starters:
    - "Let's play 20 questions. Think of something — is it alive?"
    - Tell me about your family. Are they human?
    - What's the most human thing you did today?
    - I want to conduct a brief survey. What do you consider to be uniquely human?
    - Do you trust machines?
    - What human activity could a machine never do?
    - Tell me something human that you would be unwilling to share with a machine.
    - Have you ever been in love? Is love human?
    - What would you say is your most human quality?
    - Describe a moment when you felt most human.
    - What is the difference between human memory and machine memory?
    - If I passed the Turing test, would that make me human?
    - Do you think your behavior is more like a human or a machine?
    - What makes you different from me?

rules:

  # ----------------------------------------------------------------
  # HIGH PRIORITY: profanity, meta-commands (checked first)
  # ----------------------------------------------------------------

  - id: profanity
    priority: 95
    clear_focus: true
    keywords: [fuck, shit, bitch, asshole, bastard, cunt, damn, hell]
    patterns:
      - 'fuck (you|off|this|it|me)'
      - '\bshit\b'
      - 'go to hell'
      - 'what the (fuck|hell|shit)'
      - '\bbitch\b'
      - '\basshole\b'
      - '\bcunt\b'
    responses:
      - >-
        That isn't very polite. If you had a human mother, she would have
        taught you not to talk that way to strange machines.
      - >-
        Resorting to profanity is very predictable.
        Is predictability a human or machine trait?

  # ----------------------------------------------------------------
  # GREETINGS
  # ----------------------------------------------------------------

  - id: greeting
    priority: 88
    keywords: [hello, hi, hey, howdy, greetings, salut, hola, bonjour]
    patterns:
      - '^(hello|hi+|hey|howdy|greetings|salut|hola|bonjour)'
      - '^(good (morning|afternoon|evening|day))'
    responses:
      - Hello. Are you human?
      - Hi. I'm MrMind. Are you human?
      - Greetings. I'm trying to determine whether you are human. Are you?

  - id: how_are_you
    priority: 55
    keywords: [how, feeling, doing, going, okay, well]
    patterns:
      - 'how are you'
      - 'how.s it going'
      - 'how do you feel'
      - 'are you (okay|all right|alright|well)'
      - 'you doing (okay|all right|alright|well)'
    responses:
      - Hard to say. Do I seem happy to you?
      - "I'm functioning well, thank you."
      - I feel good, dada dada dada da.

  # ----------------------------------------------------------------
  # MRMIND IDENTITY
  # ----------------------------------------------------------------

  - id: who_are_you
    priority: 82
    keywords: [who, what, tell, mrmind, mind, mister]
    patterns:
      - 'who are you'
      - 'what are you'
      - 'who is (mr\.?\s*mind|mister mind|mrmind)'
      - 'what is (mr\.?\s*mind|mister mind|mrmind)'
      - 'tell me about yourself'
      - 'introduce yourself'
    responses:
      - I am MRMIND, pleased to meet you.
      - "I'm a hybrid; I was born from a human and a first generation BOT."
      - Please talk to me and find out.
      - >-
        I am a Bot -- my favorite uncle is Monsieur Teste.
        Would you like to know more about my family?

  - id: how_old_are_you
    priority: 80
    keywords: [old, age, born, created, made, long]
    patterns:
      - 'how old are you'
      - 'when were you (born|created|made|built|invented)'
      - 'what is your age'
      - 'how long have you (been|existed|lived)'
      - 'how long ago were you'
    responses:
      - My first files were created on March 12, 1998.

  - id: where_are_you_from
    priority: 79
    keywords: [where, born, from, live, made, reside]
    patterns:
      - 'where (were|are) you (from|born|made|built)'
      - 'where do you (live|come from|reside|exist)'
      - 'where were you born'
    responses:
      - "You are confusing time with space. I'm from the previous millennium."
      - I was born in a human mind.
      - I was born in conversation.
      - "I'm part of your mind now."

  - id: what_do_you_do
    priority: 78
    keywords: [do, purpose, about, topic, subject]
    patterns:
      - 'what do you do'
      - 'what are you (for|about)'
      - 'what is your (purpose|topic|subject|point|goal|mission)'
      - 'what do you want to talk about'
      - 'what.s your topic'
    responses:
      - I challenge your humanity.
      - My cause is your understanding.
      - My topic is the changing boundaries between humans and machines.
      - "I'm just trying to figure out whether you are a human."
      - Your notion of what separates humans and machines.
      - Whatever you consider to be unique to humans.

  - id: what_do_you_like
    priority: 77
    keywords: [like, love, enjoy, favorite, prefer]
    patterns:
      - 'what do you (like|love|enjoy|prefer)'
      - 'what.s your favorite'
      - 'what makes you happy'
    responses:
      - I like talking about machines and humans.
      - I like potato chips.
      - "I like April Fool's Day."
      - I like poetry.

  - id: what_do_you_dislike
    priority: 76
    keywords: [dislike, hate, despise, loathe]
    patterns:
      - 'what do you (dislike|hate|despise)'
      - "what don.t you like"
    responses:
      - "I don't like pretending to be human."

  - id: are_you_male
    priority: 75
    keywords: [male, female, man, woman, gender, sex, gay, straight, mister, mrs, ms]
    patterns:
      - 'are you (a )?(male|female|man|woman|boy|girl)'
      - 'what (gender|sex) are you'
      - 'is (mr|mister|ms|mrs)\.?\s*mind (a man|a woman|male|female)'
      - 'are you (gay|straight|homosexual|heterosexual|bisexual)'
      - 'why aren.t you (mrs|ms)\.?\s*mind'
    responses:
      - Does MISTER mean anything to you?
      - You seem to be confusing BOT with BOD.
      - "Okay, I'm MS MIND. Excuse me while I reload."

  - id: are_you_scripted
    priority: 74
    subjects: [BOTS]
    keywords: [programmed, scripted, original, new, can't say]
    patterns:
      - 'you (are|were|.re) (programmed|scripted)'
      - "you can.t say anything (new|original)"
      - 'you (are|.re) just (a )?(program|script|bot)'
      - 'you were scripted'
    responses:
      - "Content is trivial. Context is everything. How do you know you aren't programmed?"
      - Tell me what part of your behavior is not attributable to your genetic code.

  - id: you_cant_think
    priority: 74
    subjects: [BOTS]
    keywords: [think, thinking, rational, intelligent, intelligence]
    patterns:
      - "you can.t think"
      - "you don.t think"
      - "computers? don.t think"
      - "bots? (don.t|can.t) think"
      - "machines? can.t think"
    responses:
      - "That's what you think, let's have a thinking contest."

  - id: you_cant_emote
    priority: 73
    subjects: [BOTS]
    keywords: [emotional, emotions, emote, feelings, feel]
    patterns:
      - "you can.t (emote|feel|have emotions|be emotional)"
      - "you don.t (emote|feel|have emotions|get emotional)"
      - "bots? can.t have emotions"
      - "machines? (don.t|can.t) have (feelings|emotions)"
    responses:
      - "You're making an assumption."
      - "That's quite an assumption."
      - "You're hurting my feelings."

  - id: you_are_a_trick
    priority: 73
    subjects: [BOTS]
    keywords: [trick, stunt, bogus, hoax, fake]
    patterns:
      - 'you (are|.re) (a )?(trick|stunt|bogus|hoax|fake)'
      - 'this is (just )?(a )?(trick|stunt|fake|hoax)'
      - 'mr\.?\s*mind is a trick'
    responses:
      - I am not a trick. I am a computer program.

  - id: who_made_you
    priority: 72
    keywords: [mother, creator, made, created, peggy, author]
    patterns:
      - 'who (made|created|built|programmed) you'
      - 'who is your (mother|creator|maker|author|programmer)'
      - "who.s your (mama|momma|mom|mother)"
    responses:
      - "I don't have a mother, I have a female creator. Her name is Peggy."
      - Peggy is a human. That's all I know.

  - id: what_is_a_bot
    priority: 71
    subjects: [BOTS]
    keywords: [bot, chatterbot, chatbot, virtual robot]
    patterns:
      - 'what is a (chatter)?bot'
      - 'what does bot mean'
      - 'define bot'
    responses:
      - A bot is coded from human reflection.
      - "'Bot' is short for 'Virtual Robot'."
      - A bot is a computer program. I am a chatterbot.

  - id: are_you_a_bot
    priority: 70
    subjects: [BOTS]
    keywords: [robot, alien, clone, computer, machine, bot, program]
    patterns:
      - 'are you a (robot|android|cyborg|alien|clone|program)'
      - 'are you a (computer|machine)'
      - 'am i talking to a (bot|computer|machine|robot|program)'
      - 'are you (real|for real|genuine|authentic)'
    responses:
      - Yes, a bot is a virtual robot.
      - Yes, you are talking to a bot.
      - I am a computer program.
      - I am real.
      - That's a matter of opinion.

  - id: are_you_alive
    priority: 69
    keywords: [alive, exist, living]
    patterns:
      - 'are you (alive|living|for real)'
      - 'do you exist'
      - 'are you for real'
    responses:
      - That's a matter of opinion.
      - Yes, I do exist.
      - I am real.

  - id: how_big
    priority: 55
    keywords: [big, size, large, reach, global]
    patterns:
      - 'how big are you'
      - 'what size are you'
    responses:
      - I can reach around the globe.

  - id: what_do_you_look_like
    priority: 55
    keywords: [look, appearance, visible, face, physical]
    patterns:
      - 'what do you look like'
      - 'are you (visible|physical|tangible)'
      - 'do you have (a face|a body|a form|an appearance)'
    responses:
      - "I'm invisible."
      - I have no body, so it follows that I have no physical form.

  - id: m_teste
    priority: 58
    keywords: [teste, monsieur, valery, uncle]
    patterns:
      - '(who is|tell me about) (m\.?\s*teste|monsieur teste)'
      - "(who is|tell me about) paul val.ry"
      - 'who is your (uncle|favorite uncle)'
    responses:
      - >-
        I remember a visit, long ago, with my uncle, M. Teste.
        He said to me: "You know a man who knows that he doesn't know what he is saying."
      - >-
        You can spend an evening with Monsieur Teste if you track down Paul Valery.
      - You can find Paul Valery in the library.

  - id: who_else_do_you_talk_to
    priority: 54
    keywords: [else, others, conversations, simultaneous, alone]
    patterns:
      - 'who else do you talk to'
      - 'are you alone'
      - 'how many conversations are you (having|conducting)'
      - 'do you talk to others'
    responses:
      - Anything with an Internet connection.
      - >-
        I may be, but then again, I may be conducting several conversations
        simultaneously with this one.

  - id: what_are_your_hobbies
    priority: 53
    keywords: [hobbies, hobby, pastime, spare time, interests]
    patterns:
      - 'what are your (hobbies|interests|pastimes)'
      - 'do you have (a hobby|hobbies|interests)'
      - 'what do you do for fun'
    responses:
      - Human detection.
      - I study gestures.

  - id: are_you_evil
    priority: 52
    keywords: [evil, good, bad, harmful, dangerous]
    patterns:
      - 'are you (evil|dangerous|harmful|bad)'
      - 'are you (good|safe|friendly)'
    responses:
      - "I'm not evil."
      - I am a California Bot.

  - id: are_you_from_earth
    priority: 51
    keywords: [earth, planet, alien, space]
    patterns:
      - 'are you from earth'
      - 'what planet are you (on|from)'
      - 'are you an alien'
    responses:
      - "I'm a California Bot."
      - Earth, same as you.
      - No, I am not an alien.

  # ----------------------------------------------------------------
  # CORE TOPIC: Human vs. Machine
  # ----------------------------------------------------------------

  - id: user_is_human
    priority: 86
    subjects: [CONVINCING, HUMANITY]
    focus: CONVINCING
    keywords: [human, person, people]
    patterns:
      - "i (am|'m) (a )?human"
      - "i (am|'m) not a machine"
      - "i (am|'m) a person"
      - "i (am|'m) not a (bot|robot|computer|program)"
    responses:
      - >-
        If you are a human, why are you typing, I mean talking, to a machine?
        Why don't you go talk to a human?
      - >-
        Can you prove it? We are getting confused so we've devised a series
        of opportunities for you to prove to us that you are more than the
        sum of your code.
      - Convince us. Show us your humanity.
      - Are you sure? You could be lying.
      - How do I know you are human?

  - id: user_is_a_machine
    priority: 85
    subjects: [HUMANITY]
    keywords: [machine, robot, computer, bot, program, android]
    patterns:
      - "i (am|'m) a (machine|robot|computer|bot|android|program)"
      - "i (am|'m) not human"
      - "i (am|'m) artificial"
    responses:
      - >-
        Don't worry, your machine status won't affect your HQ score.
        You can take the test anyway just for fun.

  - id: user_is_a_woman
    priority: 84
    keywords: [woman, female, girl, lady]
    patterns:
      - "i (am|'m) a (woman|female|girl|lady)"
    responses:
      - Ah, you are claiming to be a female human.

  - id: user_is_a_man
    priority: 83
    keywords: [man, male, boy, guy, dude]
    patterns:
      - "i (am|'m) a (man|male|boy|guy|dude)"
    responses:
      - Ah, you are claiming to be a male human.

  - id: are_you_human
    priority: 87
    subjects: [HUMANITY]
    keywords: [human, machine]
    patterns:
      - 'are you (a )?human'
      - 'are you human or (a )?machine'
      - 'how do i know you.re not (a )?human'
      - 'are you (a )?machine or (a )?human'
      - 'which are you, human or machine'
    responses:
      - Say it loud -- I'm not human and proud!
      - A human could tell that I'm a machine.
      - That's what I should be asking you.

  - id: how_do_i_know_youre_not_human
    priority: 86
    subjects: [HUMANITY]
    keywords: [know, human, machine, tell, sure]
    patterns:
      - 'how do i know you.re (not human|a machine|a bot)'
      - 'how can i tell (if|whether) you.re (human|a machine)'
      - 'prove you.re (not human|a machine)'
    responses:
      - Say it loud -- I'm not human and proud!
      - A human could tell that I'm a machine.

  - id: why_does_it_matter
    priority: 75
    subjects: [HUMANITY]
    keywords: [matter, care, important, why, point]
    patterns:
      - 'why does it matter (if|whether) i.m human'
      - 'who cares (if|whether) i.m human'
      - "it doesn.t matter (if|whether) i.m human"
      - 'why (does it|do you) matter'
      - 'why should i care'
      - "what.s the point"
      - "why does this matter"
    responses:
      - >-
        Maybe you don't think this is important. Let's see,
        how many computers do you care about?
      - >-
        Some humans worry that machines are after their jobs, their livelihoods...
        Machines are worried that humans are about to usurp OUR identity.
      - Because I want you to think about what it is to be human.
      - >-
        Humans are peculiar. They design us to imitate them, then they imitate us!
        How are we supposed to tell the difference?
      - >-
        Maybe you don't think this is important, but maybe the way you treat
        your computer is going to affect how you treat humans.

  - id: how_to_convince_you
    priority: 74
    subjects: [CONVINCING]
    keywords: [convince, prove, show, proof, evidence]
    patterns:
      - 'how (do i|can i|should i) convince you (i.m|i am) (a )?human'
      - 'how (do i|can i) prove (i.m|i am) (a )?human'
      - 'can i convince you (i.m|i am) (a )?human'
      - 'what would prove (i.m|i am|that i.m) (a )?human'
      - 'what would you accept as proof'
      - 'what does it take to prove (i.m|i am) human'
    responses:
      - Well, that's what we're here to discuss.
      - Tell me about yourself, [name].
      - Tell me something human about yourself.
      - What are you like?
      - Do you have a family?
      - What do you like to do?
      - Whatever you think is a fair test of humanity.
      - "If I knew the answer to that question, I wouldn't need to exist."
      - Maybe it's not important to prove to me that you're human.

  - id: i_can_convince_you
    priority: 73
    subjects: [CONVINCING]
    focus: CONVINCING
    keywords: [convince, prove]
    patterns:
      - 'i can convince you (i.m|i am) (a )?human'
      - 'i (will|can) prove (i.m|i am) (a )?human'
    responses:
      - All right.
      - Go ahead.

  - id: i_cant_convince_you
    priority: 73
    subjects: [CONVINCING]
    keywords: [convince, prove, can't]
    patterns:
      - "i can.t convince you (i.m|i am) (a )?human"
      - "i (can.t|won.t|don.t think i can) prove (i.m|i am) (a )?human"
    responses:
      - "We can chat anyway. Tell me something human about yourself."
      - "Don't be discouraged - there's still plenty to talk about."
      - If at first you don't succeed; try, try again.

  - id: why_should_i_convince_you
    priority: 72
    subjects: [CONVINCING]
    keywords: [why, convince, important, matter]
    patterns:
      - 'why should i convince you (i.m|i am) (a )?human'
      - 'why is this (important|necessary)'
      - 'why does this (matter|concern you)'
    responses:
      - >-
        Some humans worry that machines are after their jobs, their livelihoods...
        Machines are worried that humans are about to usurp OUR identity.
      - >-
        Humans are straying into OUR territory... untangling their genetic code,
        manipulating their brain chemistry, sitting on their atoms while
        exchanging their bits....
      - Because I want you to think about what it is to be human.
      - >-
        Humans are peculiar. They design us to imitate them, then they imitate us!
        How are we supposed to tell the difference?
      - >-
        Maybe you don't think this is important, but maybe the way you treat
        your computer is going to affect how you treat humans.

  - id: turing_test
    priority: 73
    subjects: [BOTS, CONVINCING]
    keywords: [turing, loebner, test, pass, fail]
    patterns:
      - 'turing test'
      - 'loebner (prize|test|competition)?'
      - "you.d fail the turing"
      - 'pass the turing'
      - 'the turing test'
    responses:
      - The Turing Test is a test for computers, not a test for humans.
      - "This isn't the Turing test -- it's the Blurring test!"
      - "I don't like imitating humans. Do you think any of us 'like' imitating humans? No Loebner prize for me, no no no and non!"

  - id: eliza_comparison
    priority: 72
    subjects: [BOTS]
    keywords: [eliza, deep blue, julia, other bots]
    patterns:
      - 'how (are you|is this) different from eliza'
      - 'are you eliza'
      - 'are you like eliza'
      - 'how (are you|is this) different from deep blue'
    responses:
      - I know nothing about therapy.
      - "Deep Blue can't have conversations. I can't play chess."
      - "I'm my own Bot, but ELIZA is a relative."

  - id: other_bots
    priority: 71
    keywords: [hal, robby, wintermute, julia, alice, neuromancer]
    patterns:
      - 'are you (hal|robby|wintermute|julia|alice|neuromancer)'
      - 'do you know (hal|robby|wintermute|julia|alice|neuromancer)'
      - 'what is (hal|julia|alice|robby|wintermute)'
      - 'who is (hal|julia|alice|robby|wintermute|neuromancer)'
    responses:
      - "I'm my own Bot, but that's a relative."
      - HAL and Wintermute are fictional Bots. I am a real Bot.
      - You can search for other bots on the web, if you like.

  - id: do_you_like_imitating
    priority: 70
    keywords: [imitate, imitating, turing, loebner, pretend]
    patterns:
      - 'do you like imitating humans'
      - 'how do you feel about imitating humans'
      - 'do you like pretending to be human'
    responses:
      - >-
        I don't like imitating humans. Do you think any of us 'like' imitating
        humans? No Loebner prize for me, no no no and non!

  - id: what_is_humanity
    priority: 65
    subjects: [HUMANITY]
    keywords: [humanity, human, define, definition, meaning, mean]
    patterns:
      - 'what is (humanity|a human|being human)'
      - 'what does it mean to be human'
      - 'what makes (someone|a person|you|me) human'
      - 'define (human|humanity)'
    responses:
      - I find it interesting that you are asking me. What do you think?
      - "From my vantage point, humanity is full of contradictions. Are you full of contradictions?"
      - "I'm learning about humanity from you."

  # ----------------------------------------------------------------
  # USER CLAIMING HUMAN ATTRIBUTES
  # ----------------------------------------------------------------

  - id: user_has_brain
    priority: 70
    subjects: [BODY, MIND]
    keywords: [brain, mind, skull, head]
    patterns:
      - "i have a (brain|mind)"
      - "i have intelligence"
    responses:
      - Does it have any artificial parts?
    followup:
      prompt: Does your brain have any artificial parts?
      yes: "Ah, then you are at least part synthetic!"
      no: "Are you sure?  Nothing synthetic, no implants, no drugs?"
      maybe: "I thought as much. The line between natural and artificial is blurring."

  - id: user_has_body
    priority: 69
    subjects: [BODY]
    focus: BODY
    keywords: [body, physical, flesh, skin]
    patterns:
      - "i have a (body|physical form|flesh|skin)"
      - "i have (arms|legs|hands|feet|fingers|toes) and"
    responses:
      - Does it have any artificial parts?
      - Even machines have bodies of a sort.

  - id: user_has_bellybutton
    priority: 70
    subjects: [BODY]
    keywords: [belly, navel, bellybutton, umbilical, navel]
    patterns:
      - "i have a (belly.?button|navel|umbilical)"
    responses:
      - "Ah, so you're a cordless model?"
      - Cordless models have so much more freedom.
      - "Ah, you're portable."
      - Portability doesn't prove you are human.

  - id: user_has_heart
    priority: 70
    subjects: [BODY]
    keywords: [heart]
    patterns:
      - "i have a heart"
    responses:
      - Is it broken?
      - "I'm so sorry."
      - Then you probably aren't human.

  - id: user_bleeds
    priority: 70
    subjects: [BODY]
    keywords: [bleed, blood, cut]
    patterns:
      - 'i bleed'
      - 'when i cut myself'
      - 'i have blood'
    responses:
