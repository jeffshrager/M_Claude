      - Do you possess any qualities that you believe to be unique to humans?
      - What are your human activities?
      - Do you have a family?
      - Explain to me how you are more than a set of instructions.
      - What is it about humanity that you're not willing to share with a machine?
      - How do I know you aren't a simulation?

